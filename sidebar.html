<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Map</title>
  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <div class="sidebar-header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </svg>
    <span class="sidebar-title">Court Map</span>
  </div>

  <div id="map"></div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Filter venues..." autocomplete="off" />
  </div>

  <div class="venue-list" id="venue-list">
    <div class="empty-state">Open the sidebar on the venues page...</div>
  </div>

  <div class="status-bar" id="status"></div>

  <script src="lib/leaflet.js"></script>
  <script src="geocache.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
